<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">PVM Runtime delivery profiles</title>
  <desc id="desc">Four delivery profiles share the same DSL, bytecode, and runtime while changing how the signed module reaches a device.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090f1d"/>
      <stop offset="1" stop-color="#131a2e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="600" rx="24" fill="url(#bg)"/>
  <text x="62" y="64" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800">One Runtime · Four Delivery Profiles</text>
  <text x="62" y="96" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">同一份 DSL 与签名字节码，通过不同渠道策略进入设备。</text>

  <rect x="62" y="126" width="1276" height="72" rx="20" fill="#101d34" stroke="#334155"/>
  <text x="700" y="157" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Shared Core</text>
  <text x="700" y="182" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">Private DSL  →  PVBC v4  →  Ed25519  →  C++17 VM  →  UIHost / Capability Host</text>
  <rect x="90" y="198" width="1220" height="4" rx="2" fill="url(#line)"/>

  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(62 242)">
      <rect width="292" height="302" rx="22" fill="#0b2b34" stroke="#22d3ee" stroke-opacity=".55"/>
      <circle cx="42" cy="42" r="19" fill="#0891b2"/>
      <path d="M34 42 l6 6 11-14" fill="none" stroke="#ecfeff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="39" fill="#ecfeff" font-size="19" font-weight="800">Offline Sealed</text>
      <text x="74" y="61" fill="#67e8f9" font-size="12" font-weight="700">FIRST LAUNCH OFFLINE</text>
      <line x1="24" y1="86" x2="268" y2="86" stroke="#155e75"/>
      <text x="24" y="119" fill="#cbd5e1" font-size="14">随 APK/AAB · IPA · HAP 打包</text>
      <text x="24" y="148" fill="#cbd5e1" font-size="14">启动不依赖网络或模块服务</text>
      <text x="24" y="177" fill="#cbd5e1" font-size="14">使用内置公钥执行完整验签</text>
      <rect x="24" y="207" width="244" height="62" rx="12" fill="#08222a"/>
      <text x="40" y="232" fill="#a5f3fc" font-size="12" font-weight="700">BEST FOR</text>
      <text x="40" y="254" fill="#e2e8f0" font-size="13">弱网、政企、强离线场景</text>
    </g>

    <g transform="translate(390 242)">
      <rect width="292" height="302" rx="22" fill="#172554" stroke="#818cf8" stroke-opacity=".58"/>
      <circle cx="42" cy="42" r="19" fill="#4f46e5"/>
      <path d="M42 29 v20 M34 41 l8 8 8-8" fill="none" stroke="#eef2ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="74" y="39" fill="#eef2ff" font-size="19" font-weight="800">Online Provisioned</text>
      <text x="74" y="61" fill="#a5b4fc" font-size="12" font-weight="700">ACTIVATE ONCE, RUN OFFLINE</text>
      <line x1="24" y1="86" x2="268" y2="86" stroke="#3730a3"/>
      <text x="24" y="119" fill="#cbd5e1" font-size="14">安装包仅含 VM 与兜底 UI</text>
      <text x="24" y="148" fill="#cbd5e1" font-size="14">首次激活后下载基础模块</text>
      <text x="24" y="177" fill="#cbd5e1" font-size="14">LKG 支持后续长期离线</text>
      <rect x="24" y="207" width="244" height="62" rx="12" fill="#111d44"/>
      <text x="40" y="232" fill="#c7d2fe" font-size="12" font-weight="700">BEST FOR</text>
      <text x="40" y="254" fill="#e2e8f0" font-size="13">静态包不携带完整业务模块</text>
    </g>

    <g transform="translate(718 242)">
      <rect width="292" height="302" rx="22" fill="#2e1b54" stroke="#a78bfa" stroke-opacity=".6"/>
      <circle cx="42" cy="42" r="19" fill="#7c3aed"/>
      <path d="M33 47 h18 M35 38 h14 M38 32 h8" fill="none" stroke="#f5f3ff" stroke-width="3.5" stroke-linecap="round"/>
      <text x="74" y="39" fill="#f5f3ff" font-size="19" font-weight="800">Store On-Demand</text>
      <text x="74" y="61" fill="#c4b5fd" font-size="12" font-weight="700">STORE-COMPLIANT DELIVERY</text>
      <line x1="24" y1="86" x2="268" y2="86" stroke="#6d28d9"/>
      <text x="24" y="119" fill="#cbd5e1" font-size="14">声明式业务作为签名资源</text>
      <text x="24" y="148" fill="#cbd5e1" font-size="14">禁止远程 DEX / JAR / SO</text>
      <text x="24" y="177" fill="#cbd5e1" font-size="14">平台政策成为编译约束</text>
      <rect x="24" y="207" width="244" height="62" rx="12" fill="#251541"/>
      <text x="40" y="232" fill="#ddd6fe" font-size="12" font-weight="700">BEST FOR</text>
      <text x="40" y="254" fill="#e2e8f0" font-size="13">应用市场的受限按需内容</text>
    </g>

    <g transform="translate(1046 242)">
      <rect width="292" height="302" rx="22" fill="#3b183f" stroke="#e879f9" stroke-opacity=".55"/>
      <circle cx="42" cy="42" r="19" fill="#a21caf"/>
      <path d="M33 38 h18 v15 H33Z M37 38 v-5 h10 v5" fill="none" stroke="#fdf4ff" stroke-width="3" stroke-linejoin="round"/>
      <text x="74" y="39" fill="#fdf4ff" font-size="19" font-weight="800">Enterprise Managed</text>
      <text x="74" y="61" fill="#f0abfc" font-size="12" font-weight="700">MDM / PRIVATE DISTRIBUTION</text>
      <line x1="24" y1="86" x2="268" y2="86" stroke="#86198f"/>
      <text x="24" y="119" fill="#cbd5e1" font-size="14">组织仓库与设备级许可</text>
      <text x="24" y="148" fill="#cbd5e1" font-size="14">可连接组织证书与审计</text>
      <text x="24" y="177" fill="#cbd5e1" font-size="14">支持受管灰度与止血</text>
      <rect x="24" y="207" width="244" height="62" rx="12" fill="#301333"/>
      <text x="40" y="232" fill="#f5d0fe" font-size="12" font-weight="700">BEST FOR</text>
      <text x="40" y="254" fill="#e2e8f0" font-size="13">专有设备、企业私有分发</text>
    </g>
  </g>
</svg>
