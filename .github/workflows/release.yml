name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            { echo "Release tag must look like v1.2.3" >&2; exit 1; }
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  android:
    needs: validate
    runs-on: ubuntu-latest
    env:
      PVM_ANDROID_STORE_PASSWORD: ${{ secrets.PVM_ANDROID_STORE_PASSWORD }}
      PVM_ANDROID_KEY_ALIAS: ${{ secrets.PVM_ANDROID_KEY_ALIAS }}
      PVM_ANDROID_KEY_PASSWORD: ${{ secrets.PVM_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - name: Restore production keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PVM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pvm-release.jks"
          echo "PVM_ANDROID_KEYSTORE=$RUNNER_TEMP/pvm-release.jks" >> "$GITHUB_ENV"
      - name: Build production-signed APK and AAB
        run: make android-production-packages
      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            dist/android/PVMRuntime-demo-release.apk
            dist/android/PVMRuntime-demo-release.aab

  sdks:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build distributable SDKs
        run: make ios-sdk-check kmp-packages
      - name: Package SDK directories
        run: |
          mkdir release-sdk
          ditto -c -k --sequesterRsrc dist/ios/PVMBridge.xcframework release-sdk/PVMBridge.xcframework.zip
          tar -C dist/kmp -czf release-sdk/pvm-runtime-kmp-maven.tgz maven
      - uses: actions/upload-artifact@v7
        with:
          name: release-sdks
          path: release-sdk/*

  publish:
    needs: [validate, android, sdks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes
