name: Publish Android SDK

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.0.13004108" \
            "cmake;3.22.1"
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$RELEASE_TAG" = "v0.6.0"
      - name: Publish precompiled AAR and Maven metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          client/platform/android/gradlew
          -p client/platform/android
          --no-daemon
          :runtime:publishReleasePublicationToGitHubPackagesRepository
