version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /client/platform/android
    schedule:
      interval: weekly
    groups:
      android-build:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /client/platform/kmp
    schedule:
      interval: weekly
    groups:
      kmp-build:
        patterns: ["*"]
